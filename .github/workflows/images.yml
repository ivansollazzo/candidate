# Runs the tests first (backend on a real PostgreSQL, including the Alembic migrations, and the frontend build),
# then builds the images of every service for each push and publishes them on GHCR as
# ghcr.io/<owner>/<repository>-<service>, tagged:
#   sha-<commit>   every commit: the tag the updater installs (see updater/updater.sh)
#   <branch>       the latest commit of each branch ("stable" is what a new installation downloads)
# Each platform is built natively on its own runner (no emulation), then a manifest list joins them under the tags.
# For an installation to download them, the packages must be public (package settings on GitHub).
name: Images

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: candidate
          POSTGRES_PASSWORD: candidate
          POSTGRES_DB: candidate_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # The migrations from an empty database, then the tests (they also compare migrations and models and check
      # the import rules in .importlinter)
      - run: alembic upgrade head && python -m pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://candidate:candidate@localhost:5432/candidate_test
          PYTHONPATH: .
      - run: npm ci && npm run build && npm run check:imports
        working-directory: frontend

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, llm, updater, backup]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
      # Pushed without a tag: the merge job below tags the manifest list
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.image.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ steps.image.outputs.arch }}
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ steps.image.outputs.arch }}
          path: digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, llm, updater, backup]
    steps:
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
          flavor: latest=false
      - working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)
